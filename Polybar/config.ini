; Basic polybar bar, colours match the i3 config

[colors]
background = #1C1C26
background-alt = #223249
foreground = #ffffff
muted = #878897
primary = #7351FE
alert = #CD3F45

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 26
background = ${colors.background}
foreground = ${colors.foreground}
padding-right = 2
module-margin = 1
separator = |
separator-foreground = ${colors.muted}
font-0 = RobotoMono Nerd Font:size=10;2
font-1 = monospace:size=10;2
modules-left = i3
modules-center = date
modules-right = fred pulseaudio memory cpu
cursor-click = pointer
enable-ipc = true

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = false
label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-padding = 2
label-visible = %name%
label-visible-padding = 2
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2
label-mode = %mode%
label-mode-background = ${colors.alert}
label-mode-padding = 2

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = %date%  %time%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.muted}
label-muted = muted
label-muted-foreground = ${colors.muted}

[module/memory]
type = internal/memory
interval = 3
format-prefix = "RAM "
format-prefix-foreground = ${colors.muted}
label = %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 3
format-prefix = "CPU "
format-prefix-foreground = ${colors.muted}
label = %percentage%%

[module/fred]
type = custom/script
exec = ~/.config/polybar/scripts/fred.sh
interval = 3600
format-prefix = "ECON "
format-prefix-foreground = ${colors.muted}

[settings]
screenchange-reload = true
